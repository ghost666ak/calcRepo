<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A static, accessible developer calculator with basic, scientific, base, programmer, and coding toolbox modes." />
    <meta name="theme-color" content="#0f172a" />
    <title>calcRepo — Static developer calculator</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-192.png" />
    <script type="module" crossorigin src="/calcRepo/assets/index-CCMlnku5.js"></script>
    <link rel="stylesheet" crossorigin href="/calcRepo/assets/index-CY7q7mVX.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the user's theme synchronously so first paint matches their
      // preference and the body background doesn't flash light → dark.
      // Mirrors the resolver in src/app/useTheme.ts.
      (function () {
        try {
          var raw = window.localStorage.getItem('calcRepo.preferences.v1');
          var pref = 'system';
          if (raw) {
            var m = /"theme"\s*:\s*"(light|dark|system)"/.exec(raw);
            if (m) pref = m[1];
          }
          var resolved =
            pref === 'light' || pref === 'dark'
              ? pref
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {
          // localStorage / matchMedia unavailable — fall through; React will
          // set the attribute as soon as it boots.
        }
      })();
    </script>
  </body>
</html>
